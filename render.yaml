services:
  - type: web
    name: r2k-enterprises-services
    runtime: docker
    plan: free
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_KEY
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: READ_DB_HOSTNAME
        sync: false
      - key: WRITE_DB_HOSTNAME
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: DEFAULT_ORG_UID
        sync: false
      - key: ASSET_BASE_URL
        sync: false
